controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    
    pid_controller:
      type: pid_controller/PidController

velocity_controller:
  ros__parameters:
    joints:
      - FL_wheel
      - BL_wheel
      - BR_wheel
      - FR_wheel
      - FL_steering
      - BL_steering
      - BR_steering
      - FR_steering

pid_controller:
  ros__parameters:

    dof_names:
      - following_controller/BR_steering

    gains:
      following_controller/BR_steering: {"p": 1.0, "i": 0.0, "d": 0.0}