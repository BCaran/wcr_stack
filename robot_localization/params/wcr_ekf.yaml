### ekf config file ###
ekf_filter_node:
    ros__parameters:
        frequency: 60.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false
        debug_out_file: /path/to/debug/file.txt
        permit_corrected_publication: false
        publish_acceleration: false
        publish_tf: true

#        map_frame: map              # Defaults to "map" if unspecified
        odom_frame: odom            # Defaults to "odom" if unspecified
        base_link_frame: base_link  # Defaults to "base_link" if unspecified
        world_frame: odom           # Defaults to the value of odom_frame if unspecified

#--------------------ODOMETRIJA ROBOTA--------------------
# values is x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az.
        odom0: wcr/odom
        odom0_config: [false,  false,  false,
                       false, false, false,
                       true, true, false,
                       false, false, true,
                       false, false, false]
        odom0_queue_size: 200
        odom0_nodelay: false
        odom0_differential: false
        odom0_relative: true
        odom0_pose_rejection_threshold: 5.0
        odom0_twist_rejection_threshold: 1.0


#--------------------ODOMETRIJA KAMERE--------------------
# ODOM1 - T265 Visual odometry
# values is x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az.
        odom1: t265/odom/sample
        odom1_config: [false, false, false,
                       false, false, false,
                       true, true, true,
                       true, true, false,
                       false, false, false]
        odom1_differential: false
        odom1_relative: false
        odom1_queue_size: 200
        odom1_pose_rejection_threshold: 0.05
        odom1_twist_rejection_threshold: 0.1
        odom1_nodelay: false


#-------------------- IMU --------------------
# IMU0 - BNO055 
# values is x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az.
        imu0: bno055/imu
        imu0_config: [false, false, false,
                      false,  false,  true,
                      false, false, false,
                      true,  true,  true,
                      true,  true,  false]
        imu0_nodelay: false
        imu0_differential: false
        imu0_relative: true
        imu0_queue_size: 30
        imu0_pose_rejection_threshold: 0.8                 # Note the difference in parameter names
        imu0_twist_rejection_threshold: 0.89               #
        imu0_linear_acceleration_rejection_threshold: 3.0  #
        imu0_remove_gravitational_acceleration: false

#-------------------- FILTER --------------------

        use_control: false
        stamped_control: false
        control_timeout: 0.2
        control_config: [true, true, false, false, false, true]
        acceleration_limits: [1.3, 0.0, 0.0, 0.0, 0.0, 3.4]
        deceleration_limits: [1.3, 0.0, 0.0, 0.0, 0.0, 4.5]
