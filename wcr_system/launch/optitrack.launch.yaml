launch:
- arg:
    name: "server"
    default: "192.168.1.236"
- arg:
    name: "port"
    default: "3883"
- arg:
    name: "update_freq"
    default: "120"
- node:
    pkg: "vrpn_mocap"
    namespace: "optitrack"
    exec: "client_node"
    name: "vrpn_mocap_client_node"
    param:
    -
      from: "$(find-pkg-share wcr_system)/config/optitrack_config.yaml"
    -
      name: "server"
      value: "$(var server)"
    -
      name: "port"
      value: "$(var port)"

