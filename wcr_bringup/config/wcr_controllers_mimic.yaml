controller_manager:
    ros__parameters:
      update_rate: 500  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      main_driving_controller:
        type: forward_command_controller/ForwardCommandController

      main_steering_controller:
        type: forward_command_controller/ForwardCommandController
 
      mimic_driving_controller:
        type: forward_command_controller/ForwardCommandController

      mimic_steering_controller:
        type: forward_command_controller/ForwardCommandController
    
joint_state_broadcaster:
  ros__parameters:
    joints:
      - FL_wheel
      - BL_wheel
      - BR_wheel
      - FR_wheel
      - FL_steering
      - BL_steering
      - BR_steering
      - FR_steering

main_driving_controller:
  ros__parameters:
    joints:
      - FL_wheel
    interface_name: effort

main_steering_controller:
  ros__parameters:
    joints:
      - FL_steering
      - BL_steering
    interface_name: effort

mimic_driving_controller:
  ros__parameters:
    joints:
      - BL_wheel
      - BR_wheel
      - FR_wheel
    interface_name: velocity

mimic_steering_controller:
  ros__parameters:
    joints:
      - FR_steering
      - BR_steering
    interface_name: position
    

